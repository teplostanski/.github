name: 🐞 Bug report
description: Report an issue
labels: [pending triage]
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Show us the bug

        > [!CAUTION]
        > **This is the most important part.**
        > A **minimal reproduction** is required to investigate and fix the issue, or it will be closed.

        A minimal reproduction is **required**, otherwise the issue might be closed without further notice. [**Why & How?**](https://antfu.me/posts/why-reproductions-are-required)

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction link or steps
      placeholder: https://github.com/... or https://stackblitz.com/...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > **🙋 Need help?** Use [_Priority Support_](https://github.com/sponsors/sxzz) for debugging help and implementation!

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us in the description. Thanks!
      placeholder: Bug description
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Output of `npx envinfo --system --binaries --browsers`
      render: Shell
      placeholder: System, Binaries, Browsers
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Follow our [Code of Conduct](https://github.com/sxzz/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: Read the [Contributing Guide](https://github.com/sxzz/contribute).
          required: true
        - label: Check that there isn't already an issue that reports the same bug to avoid creating a duplicate.
          required: true
        - label: Check that this is a concrete bug. For Q&A, please open a GitHub Discussion instead.
          required: true
        - label: The provided reproduction is a [minimal reproducible](https://stackoverflow.com/help/minimal-reproducible-example) of the bug.
          required: true

  - type: markdown
    attributes:
      value: |
        ## 🛠️ Contribute

  - type: checkboxes
    id: contributions
    attributes:
      label: Contributions
      description: Please note that Open Source projects are maintained by volunteers, where your cases might not be always relevant to the others. It would make things move faster if you could help investigate and propose solutions.
      options:
        - label: I am willing to submit a PR to fix this issue
        - label: I am willing to submit a PR with failing tests (actually just go ahead and do it, thanks!)

  # Thanks to @privatenumber for his sponsorship inspiration
  - type: checkboxes
    attributes:
      label: Compensating engineering work will speed up resolution and support the project
      options:
        - label: I'm willing to offer $16 for financial support

  - type: markdown
    attributes:
      value: |
        ## 🚀 Need immediate help?
        Escalate this issue by supporting the project as a [_Priority Patron_](https://github.com/sponsors/sxzz)!

        Your concern will receive prompt attention, ensuring faster and more efficient resolution.

        [→ Become a _Priority Patron_!](https://github.com/sponsors/sxzz)
